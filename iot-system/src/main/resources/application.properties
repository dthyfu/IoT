
spring.application.name=iot-system

spring.datasource.url=jdbc:mysql://localhost:3306/iot_system?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080


# MQTT configuration
mqtt.broker-url=tcp://
mqtt.client-id=spring-boot-controller
mqtt.topic.device-control=esp32/device-control
mqtt.username=
mqtt.password=

